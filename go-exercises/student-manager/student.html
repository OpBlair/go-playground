<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - School Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { 600: '#16a34a' } } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-600 text-white p-2 rounded-xl"><i class="fa-solid fa-user-graduate"></i></div>
                <h1 class="font-bold text-slate-900">Student Portal: John_Doe (ID: 1)</h1>
            </div>
            <a href="login.html" class="text-xs text-red-600 font-medium hover:underline">Logout</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-6">
        <!-- Personal Summary -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                <p class="text-xs font-semibold text-slate-400 uppercase">Enrolled Course</p>
                <h3 class="text-xl font-bold text-slate-800 mt-1">BSCS (Computer Science)</h3>
                <p class="text-xs text-emerald-600 font-medium mt-2"><i class="fa-solid fa-check mr-1"></i> Good Academic Standing</p>
            </div>
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs">
                <p class="text-xs font-semibold text-slate-400 uppercase">Calculated Overall Average</p>
                <h3 class="text-2xl font-bold text-slate-800 mt-1">81.00%</h3>
                <span class="font-mono text-xs text-slate-400">Marks: 70, 80, 85, 89</span>
            </div>
        </div>

        <!-- Available Quizzes Section -->
        <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
            <h2 class="font-semibold text-slate-800 mb-4"><i class="fa-solid fa-list-check text-brand-600 mr-2"></i> Pending Quizzes</h2>
            <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100">
                <div>
                    <h4 class="font-medium text-sm text-slate-800">Go Slices & Arrays Quiz</h4>
                    <p class="text-xs text-slate-500">Instructor: Prof. Smith</p>
                </div>
                <button onclick="alert('Starting quiz simulation...')" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-medium">Take Quiz</button>
            </div>
        </div>
    </main>
</body>
</html>
